[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lateral-mppi-dagger"
version = "0.1.0"
description = "Standalone 93D-to-16D BC/DAgger pipeline for pcbC lateral motion"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "PyYAML",
  "torch",
]

[project.optional-dependencies]
export = ["onnx", "onnxruntime"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

