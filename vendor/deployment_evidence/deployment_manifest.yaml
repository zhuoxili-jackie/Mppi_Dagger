bundle:
  name: pcbc_baseline_residual_sim2sim
  source_git_commit: cb079937ac3112b1b4bed9d26db3ea8cbee13771
  note: "residual_candidate.onnx predates the latest y/yaw reward changes; replace it after final export."

runtime:
  policy_frequency_hz: 50
  observation_dim: 93
  action_dim: 16
  baseline_model: "runtime/models/baseline.onnx"
  residual_model: "runtime/models/residual_candidate.onnx"
  motion_csv: "runtime/motion/pcbv2_x6u_60hz_stage_up_531.csv"

joint_order_policy:
  - FL_hip_joint
  - FR_hip_joint
  - RL_hip_joint
  - RR_hip_joint
  - FL_thigh_joint
  - FR_thigh_joint
  - RL_thigh_joint
  - RR_thigh_joint
  - FL_calf_joint
  - FR_calf_joint
  - RL_calf_joint
  - RR_calf_joint
  - FL_foot_joint
  - FR_foot_joint
  - RL_foot_joint
  - RR_foot_joint

runtime_index_map_from_policy:
  - 0
  - 3
  - 6
  - 9
  - 1
  - 4
  - 7
  - 10
  - 2
  - 5
  - 8
  - 11
  - 12
  - 13
  - 14
  - 15

