backend: whole_body_mppi
status: candidate_requires_isaac_force_validation
reference_config: configs/reference_low_load_v1.yaml
official_repository: "https://github.com/jrapudg/RTWholeBodyMPPI"
reference_only_runtime_dependency: false
control_hz: 50
# Twice the old lookahead.  At 0.03 m/s this spans multiple crawl support
# transfers, while remaining feasible for 256 Isaac GPU clones.
horizon: 40
samples: 256
optimization_iterations: 2
temperature: 1.0
noise_std_leg: [0.25, 0.25, 0.25, 0.25, 0.35, 0.35, 0.35, 0.35, 0.35, 0.35, 0.35, 0.35]
temporal_smoothing: 0.80
warm_start: true
selection_mode: weighted
reference_action_lookahead_steps: 1
seed: 42
contact_force_threshold_n: 8.0
physical_target_rate_limit_rad_s: 2.25
cost_weights:
  base_position: 40.0
  base_orientation: 22.0
  joint_position: 8.0
  joint_velocity: 0.12
  wheel_position: 60.0
  lateral_velocity: 8.0
  box_x_drift: 70.0
  wheel_slip: 0.50
  contact_mismatch: 4.0
  front_normal_support: 12.0
  rear_force_overload: 26.0
  rear_force_imbalance: 5.0
  rear_support_loss: 40.0
  edge_drop: 140.0
  action_residual: 0.06
  action_rate: 0.10
  joint_acceleration: 0.000004
  torque_limit: 0.30
  joint_limit: 180.0
  termination: 3000.0
  terminal: 10.0
load_limits:
  front_normal_min_n: 6.0
  rear_normal_overload_n: 105.0
  rear_normal_scale_n: 35.0
  rear_balance_scale_n: 70.0
state_copy_gate:
  cost_max_abs: 0.00001
  state_max_abs: 0.00001
closed_loop_gate:
  seed_file: configs/seeds_nominal_100.txt
  fixed_seed_count: 50
  required_successes: 48
  required_teacher_valid_rate: 0.99
  full_episode_steps: 300
  rotate_references: true
  required_scenario_resolved_name: nominal
  require_requested_reference_reset: true
  reset_reference_tolerance: 0.00001
  require_implementation_hashes: true
  tracking_thresholds:
    base_position_max_abs_m: [0.12, 0.10, 0.10]
    box_local_x_drift_max_abs_m: 0.10
    base_orientation_rmse_rad: 0.20
    wheel_position_rmse_m: 0.08
    contact_mismatch_rate: 0.25
    lateral_velocity_mae_max_m_s: 0.025
    lateral_displacement_error_max_abs_m: 0.08
    signed_lateral_progress_ratio_min: 0.60
    rear_normal_force_p95_max_n: 135.0
    rear_single_support_fraction_max: 0.45
    rear_no_support_fraction_max: 0.01
    front_normal_below_6n_fraction_max: 0.20
    physical_leg_target_step_max_rad: 0.055
smoke_profile:
  horizon: 12
  samples: 16
  optimization_iterations: 1
smoke_episode_budget: 25
note: "Load-aware, low-clearance, fixed-stride/cadence-scaled candidate. Do not train or deploy until the Isaac force gate passes."
